# Preserve this Linux desktop's Everforest colors.
set -g status-style "bg=default,fg=#859289"
set -g status-left "#[fg=#a7c080,bold]#S "
set -g window-status-style "bg=default,fg=#859289"
set -g window-status-format " #[fg=#859289]#{?window_bell_flag,🔔 ,}#I:#W "
set -g window-status-current-format " #[fg=#dbbc7f,bold]#I:#W "
set -g message-style "bg=default,fg=#d3c6aa"
set -g message-command-style "bg=default,fg=#d3c6aa"
set -g pane-border-style "fg=#414b50"
set -g pane-active-border-style "fg=#a7c080"
set -g display-panes-colour "#859289"
set -g display-panes-active-colour "#dbbc7f"
setw -g clock-mode-colour "#a7c080"
