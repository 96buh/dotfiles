# Shared macOS / Linux settings. Resolve zsh from each machine's PATH.
set -g default-terminal "xterm-256color"
set -g base-index 1
setw -g pane-base-index 1
# Use an interactive non-login zsh; resolve both options in one shell invocation.
run-shell 'shell_path=$(command -v zsh) && tmux set-option -g default-shell "$shell_path" \; set-option -g default-command "$shell_path"'

set -g status-keys emacs
set -g mode-keys emacs
set -s escape-time 10
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on
setw -g aggressive-resize on

set -as terminal-features ",xterm-256color:RGB"
set -g mouse on

set -g status-position top
set -g status-justify absolute-centre
set -g status-right ""
set -g status-left "#S "
set -g status-left-length 50
set -g status-style "bg=default,fg=#a89984"
set -g window-status-format "#[fg=#a89984]#I:#W"
set -g window-status-current-style "nounderscore"
set -g window-status-current-format "#[fg=#fabd2f,bold]#I:#W"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"

# Native bindings replace sensible/yank; no plugin or background restore jobs.
bind-key b last-window
bind-key C-p previous-window
bind-key C-n next-window
bind-key R source-file ~/.config/tmux/tmux.conf
bind-key -r f new-window ~/.local/bin/tmux-sessionizer
set -s set-clipboard on
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command pbcopy' {
  if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null 2>&1' 'set -s copy-command wl-copy' {
    if-shell 'command -v xclip >/dev/null 2>&1' 'set -s copy-command "xclip -selection clipboard"'
  }
}
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
