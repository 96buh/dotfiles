# Shared macOS / Linux settings. Resolve zsh from each machine's PATH.
set -g default-terminal "xterm-256color"
set -g base-index 1
setw -g pane-base-index 1
set -g prefix C-b
bind-key C-b send-prefix
run-shell 'shell_path=$(command -v zsh) && tmux set-option -g default-shell "$shell_path"'

set -g status-keys emacs
set -g mode-keys emacs
set -g mouse off
set -g focus-events off
setw -g aggressive-resize off
setw -g clock-mode-style 12
set -s escape-time 10
set -g history-limit 2000

# macOS: Home Manager links this plugin; Linux: install it at the same path.
if-shell 'test -f "$HOME/.config/tmux/plugins/sensible/sensible.tmux"' 'run-shell "\"$HOME/.config/tmux/plugins/sensible/sensible.tmux\""'

set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
run-shell 'shell_path=$(command -v zsh) && tmux set-option -g default-command "$shell_path"'

set -g status-position top
set -g status-justify centre
set -g status-right ""
set -g status-left "#S "
set -g status-style "bg=default,fg=#a89984"
set -g window-status-format "#[fg=#a89984]#I:#W"
set -g window-status-current-format "#[fg=#fabd2f,bold]#I:#W"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-dir "$HOME/.local/state/tmux/resurrect"

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Restore bindings must load before continuum; keep continuum after status-right.
if-shell 'test -f "$HOME/.config/tmux/plugins/resurrect/resurrect.tmux"' 'run-shell "\"$HOME/.config/tmux/plugins/resurrect/resurrect.tmux\""'
if-shell 'test -f "$HOME/.config/tmux/plugins/yank/yank.tmux"' 'run-shell "\"$HOME/.config/tmux/plugins/yank/yank.tmux\""'
if-shell 'test -f "$HOME/.config/tmux/plugins/resurrect/resurrect.tmux" && test -f "$HOME/.config/tmux/plugins/continuum/continuum.tmux"' 'run-shell "\"$HOME/.config/tmux/plugins/continuum/continuum.tmux\""'
